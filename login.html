<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UJ Hub | Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Your styles -->
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-dark-main text-light">

<header class="site-header">
  <div class="container d-flex flex-wrap align-items-center justify-content-between py-3">
    <h1 class="site-title m-0">UJ Hub</h1>
    <nav aria-label="Main navigation">
      <ul class="nav main-nav w-100">
        <li class="nav-item">
          <a class="nav-link" href="index.html">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="about-us.html">About Us</a>
        </li>
        <li class="nav-item ms-auto">
          <a class="nav-link active" href="login.html">Login</a>
        </li>
      </ul>
    </nav>
  </div>
</header>

<main class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6">

        <!-- LOGIN CARD -->
        <div id="loginCard" class="card form-card p-4 mb-4">
          <h2 class="h4 mb-3">Student Login</h2>
          <form id="loginForm" novalidate>
            <div class="mb-3">
              <label for="loginStudentId" class="form-label">Student ID</label>
              <input id="loginStudentId" type="text" class="form-control form-control-dark" required>
            </div>
            <div class="mb-3">
              <label for="loginPassword" class="form-label">Password</label>
              <input id="loginPassword" type="password" class="form-control form-control-dark" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
          </form>
          <div id="loginError" class="text-danger small mt-2"></div>

          <hr class="my-4">

          <button id="showRegisterBtn" class="btn btn-outline-primary w-100" type="button">
            Create an Account
          </button>
        </div>

        <!-- REGISTER CARD (hidden at first) -->
        <div id="registerCard" class="card form-card p-4 d-none">
          <h2 class="h4 mb-3">Create an Account</h2>
          <form id="registerForm" novalidate>
            <div class="mb-3">
              <label for="regStudentId" class="form-label">Student ID</label>
              <input id="regStudentId" type="text" class="form-control form-control-dark" required>
            </div>
            <div class="mb-3">
              <label for="regEmail" class="form-label">University Email</label>
              <input id="regEmail" type="email" class="form-control form-control-dark" required>
            </div>
            <div class="mb-3">
              <label for="regPassword" class="form-label">Password</label>
              <input id="regPassword" type="password" class="form-control form-control-dark" required>
            </div>
            <div class="mb-3">
              <label for="regPasswordConfirm" class="form-label">Confirm Password</label>
              <input id="regPasswordConfirm" type="password" class="form-control form-control-dark" required>
            </div>
            <button type="submit" class="btn btn-outline-primary w-100">Register</button>
          </form>
          <div id="registerError" class="text-danger small mt-2"></div>
          <div id="registerSuccess" class="text-success small mt-2"></div>

          <button id="backToLoginBtn" class="btn btn-link mt-3 text-decoration-none" type="button">
            ← Back to Login
          </button>
        </div>

      </div>
    </div>
  </div>
</main>

<footer class="site-footer py-4 mt-auto">
  <div class="container text-center small text-light-muted">
    <p class="mb-1">&copy; 2025 UJ Hub – University of Jeddah</p>
  </div>
</footer>

<!-- IMPORTANT: only this script on login page -->
<script src="login.js" defer></script>

</body>
</html>
